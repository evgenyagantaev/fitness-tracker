# Put inside the existing HTTPS `server { ... }` block (listen 443) for your domain.
location = /fitness { return 301 /fitness/; }
location /fitness/ {
    proxy_pass http://127.0.0.1:8010/;        # trailing slash strips the /fitness prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /fitness;
    client_max_body_size 2m;
    proxy_read_timeout 30s;
}
